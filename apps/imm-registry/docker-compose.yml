services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: imm_registry
      POSTGRES_PASSWORD: imm_registry
      POSTGRES_DB: imm_registry
    volumes:
      - imm-registry-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imm_registry -d imm_registry"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: apps/imm-registry/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://imm_registry:imm_registry@postgres:5432/imm_registry
      IMM_REGISTRY_BIND: 0.0.0.0:8080
      IMM_REGISTRY_PUBLIC_BASE_URL: http://localhost:${IMM_REGISTRY_PORT:-8080}
      IMM_REGISTRY_STORAGE_ROOT: /var/lib/imm-registry
      IMM_REGISTRY_ADMIN_TOKEN: dev-admin-token
      RUST_LOG: imm_registry=info,tower_http=info
    ports:
      - "${IMM_REGISTRY_PORT:-8080}:8080"
    volumes:
      - ./storage:/var/lib/imm-registry

volumes:
  imm-registry-postgres:
