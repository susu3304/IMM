name: Deploy IMM Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/imm-web/**"
      - "crates/imm-core/**"
      - "crates/imm-wasm/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/deploy-imm-web.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/imm-web/package-lock.json

      - name: Install dependencies
        working-directory: apps/imm-web
        run: npm ci

      - name: Build
        working-directory: apps/imm-web
        run: npm run build

      - name: Skip deploy when Cloudflare secrets are missing
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "Cloudflare deploy skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."

      - uses: cloudflare/wrangler-action@v3
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: apps/imm-web
