[package]
name = "imm-native"
version = "0.2.1"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
imm-core = { path = "../imm-core", features = ["native"] }
serde_json = "1"

[lib]
name = "imm_native"
path = "src/lib.rs"

[[bin]]
name = "imm-native"
path = "src/main.rs"
